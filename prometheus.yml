global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'vllm'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['vllm:8000']
        labels:
          service: 'vllm-server'

  - job_name: 'gpu'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          service: 'nvidia-gpu'
