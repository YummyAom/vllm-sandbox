services:
  # ── vLLM Control Dashboard ────────────────────────────────────

  # 5. Dashboard Backend (Go — High Performance Control Plane)
  vllm-dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: vllm-dashboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker control
      - ~/.cache/huggingface:/root/.cache/huggingface
      - dashboard_data:/data
    environment:
      VLLM_CONTAINER_NAME: vllm-server
      VLLM_IMAGE: vllm/vllm-openai:latest
      VLLM_API_BASE: http://vllm-server:8000
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      DOCKER_NETWORK: vllm_vllm_net
    networks:
      - vllm_net

  # 6. Dashboard Frontend (Nginx — Web UI on port 3001)
  vllm-dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: vllm-dashboard-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - vllm-dashboard-backend
    networks:
      - vllm_net


  # 1. vLLM Inference Engine
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    command:
      - Qwen/Qwen3-0.6B
      - --gpu-memory-utilization
      - "0.85"
      - --max-model-len
      - "4096"
      - --trust-remote-code
    networks:
      - vllm_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # 2. NVIDIA DCGM-Exporter (GPU Hardware & VRAM Metrics)
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: vllm-dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks:
      - vllm_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  # 3. Prometheus (Time-series Metrics Database)
  prometheus:
    image: prom/prometheus:latest
    container_name: vllm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - vllm_net

  # 4. Grafana (Visual Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: vllm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - vllm_net
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  dashboard_data:

networks:
  vllm_net:
    driver: bridge
